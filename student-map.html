<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Student Map – Nasr City</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #4ade80;
    --accent2: #38bdf8;
    --accent3: #f59e0b;
    --text: #e8eaf6;
    --muted: #6b7280;
    --border: rgba(255,255,255,0.08);
    --radius: 16px;
    --pill: 999px;

    /* Category colors */
    --cat-marakiz: #38bdf8;
    --cat-book: #f59e0b;
    --cat-sports: #4ade80;

    /* Zone colors */
    --zone-h9: #0288D1;
    --zone-h8: #FFD600;
    --zone-h7: #E65100;
    --zone-h10: #FF5252;
    --zone-makram: #097138;
    --zone-h6: #673AB7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    padding: 12px 16px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  h1 small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* ── Filter chips ── */
  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filters::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: var(--pill);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 12px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .chip.active {
    border-color: currentColor;
    color: var(--text);
    background: rgba(255,255,255,0.07);
  }

  .chip[data-filter="all"].active  { color: var(--accent); border-color: var(--accent); }
  .chip[data-filter="Marakiz"].active { color: var(--cat-marakiz); border-color: var(--cat-marakiz); }
  .chip[data-filter="Book store"].active { color: var(--cat-book); border-color: var(--cat-book); }
  .chip[data-filter="Sports"].active { color: var(--cat-sports); border-color: var(--cat-sports); }
  .chip[data-filter="zones"].active { color: #a78bfa; border-color: #a78bfa; }

  /* ── Map ── */
  #map {
    flex: 1;
    z-index: 1;
  }

  /* Override Leaflet default styles for dark theme */
  .leaflet-popup-content-wrapper {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-radius: 14px !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    padding: 0 !important;
  }

  .leaflet-popup-content {
    margin: 0 !important;
    width: auto !important;
    min-width: 200px;
  }

  .leaflet-popup-tip {
    background: var(--surface) !important;
  }

  .leaflet-popup-close-button {
    color: var(--muted) !important;
    font-size: 18px !important;
    top: 8px !important; right: 8px !important;
  }

  .leaflet-control-zoom {
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    overflow: hidden;
  }

  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-bottom-color: var(--border) !important;
    width: 36px !important; height: 36px !important;
    line-height: 36px !important;
    font-size: 18px !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--surface2) !important;
  }

  /* ── Popup content ── */
  .popup-inner {
    padding: 14px 16px;
  }

  .popup-cat {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
    font-weight: 500;
  }

  .popup-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .popup-addr {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .popup-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    border-radius: var(--pill);
    font-size: 12px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.85; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #22d3ee);
    color: #0f1117;
  }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* ── Bottom sheet: location list ── */
  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    z-index: 2000;
    transform: translateY(calc(100% - 56px));
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 75dvh;
    display: flex;
    flex-direction: column;
  }

  .sheet.open {
    transform: translateY(0);
  }

  .sheet-handle-area {
    padding: 10px 16px 0;
    cursor: pointer;
    flex-shrink: 0;
  }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 10px;
  }

  .sheet-title {
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .sheet-count {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    font-weight: 400;
  }

  .sheet-body {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0 env(safe-area-inset-bottom, 8px);
  }

  .place-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
  }

  .place-row:last-child { border-bottom: none; }
  .place-row:hover { background: var(--surface2); }

  .place-icon {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .place-info { flex: 1; min-width: 0; }

  .place-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .place-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .place-arrow {
    color: var(--muted);
    font-size: 16px;
    flex-shrink: 0;
  }

  /* ── Fab (toggle list) ── */
  .fab {
    position: fixed;
    bottom: 68px; right: 16px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0f1117;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 1500;
    transition: transform 0.2s;
  }

  .fab:hover { transform: scale(1.08); }

  /* ── Custom markers ── */
  .marker-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 16px;
    border-radius: var(--pill);
    font-size: 13px;
    border: 1px solid var(--border);
    z-index: 3000;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .popup-ride-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 10px 0 6px;
  }

  .btn-ride {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-indrive { border-color: #00c247; color: #00c247; }
  .btn-uber    { border-color: #000; background: #000; color: #fff; }
  .leaflet-control-attribution {
    background: rgba(15,17,23,0.8) !important;
    color: var(--muted) !important;
  }

  .leaflet-control-attribution a { color: var(--muted) !important; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">🗺️</div>
    <h1>Student Map
      <small>Nasr City · Cairo</small>
    </h1>
  </div>
  <div class="filters">
    <button class="chip active" data-filter="all">
      <span class="dot" style="background:var(--accent)"></span>All
    </button>
    <button class="chip" data-filter="Marakiz">
      <span class="dot" style="background:var(--cat-marakiz)"></span>Marakiz
    </button>
    <button class="chip" data-filter="Book store">
      <span class="dot" style="background:var(--cat-book)"></span>Books
    </button>
    <button class="chip" data-filter="Sports">
      <span class="dot" style="background:var(--cat-sports)"></span>Sports
    </button>
    <button class="chip" data-filter="zones">
      <span class="dot" style="background:#a78bfa"></span>Zones
    </button>
  </div>
</header>

<div id="map"></div>

<button class="fab" id="fabBtn" title="View list">☰</button>

<div class="sheet" id="sheet">
  <div class="sheet-handle-area" id="sheetHandle">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <span>Locations</span>
      <span class="sheet-count" id="countLabel">6 places</span>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Telegram Web App init ──
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#1a1d27');
  tg.setBackgroundColor('#0f1117');
}

// ── Data ──
const LOCATIONS = [
  {
    name: "Maktabah Nūr al-Islām (Maktabah ʿAlī)",
    category: "Book store",
    address: "Al Hay Al Asher, Nasr City",
    coords: [30.0530, 31.3590], // near plus code 29V9+G2W
    google: "Maktabah Nūr al-Islām (Maktabah 'Alī)",
    icon: "📚", color: "#f59e0b"
  },
  {
    name: "Markaz Furqan",
    category: "Marakiz",
    address: "Nasr City",
    coords: [30.053840, 31.359129],
    google: "",
    icon: "🕌", color: "#38bdf8"
  },
  {
    name: "Markaz Al Ibaanah",
    category: "Marakiz",
    address: "Saqaliya St, off Makram Ebeid, Nasr City",
    google: "Al Ibaanah Arabic Center",
    coords: [30.0558, 31.3505], // Saqaliya / Makram Ebeid area
    icon: "🕌", color: "#38bdf8"
  },
  {
    name: "Sport Life Academy (BJJ)",
    category: "Sports",
    address: "Nasr City",
    coords: [30.041906, 31.331652],
    google: "",
    icon: "🥋", color: "#4ade80"
  },
  {
    name: "Markaz Fajr",
    category: "Marakiz",
    address: "13 Alfarouq Omar St, At Taseah, Nasr City",
    google: "Fajr Center for Arabic Language",
    coords: [30.0520, 31.3630], // approximate for At Taseah
    icon: "🕌", color: "#38bdf8"
  },
  {
    name: "Markaz Lisan al Arab",
    category: "Marakiz",
    address: "75 Mahdy Arafa, At Taseah, Nasr City",
    google: "لسان العرب لرجال",
    coords: [30.0510, 31.3620],
    icon: "🕌", color: "#38bdf8"
  }
];

const ZONES = [
  {
    name: "Hayy 9",
    color: "#0288D1",
    coords: [[30.0556952,31.3575406],[30.0468172,31.3565965],[30.0491389,31.3788266],[30.0582025,31.3799639]]
  },
  {
    name: "Hayy 8",
    color: "#FFD600",
    coords: [[30.0557067,31.3571324],[30.053608,31.3387646],[30.0449898,31.3400521],[30.0467358,31.3561024]]
  },
  {
    name: "Hayy 7",
    color: "#E65100",
    coords: [[30.0434605,31.3293488],[30.0403584,31.3298424],[30.0370148,31.3328893],[30.0342098,31.3390048],[30.0350829,31.3467081],[30.0451879,31.345249]]
  },
  {
    name: "Hayy 10",
    color: "#FF5252",
    coords: [[30.0463077,31.3565832],[30.0363143,31.3554674],[30.0381347,31.377483],[30.0486481,31.3786846]]
  },
  {
    name: "Makram Ebeid",
    color: "#4ade80",
    coords: [[30.0685174,31.3365714],[30.0542174,31.3385026],[30.0549231,31.3458412],[30.0693344,31.3439958]]
  },
  {
    name: "Hayy 6",
    color: "#a78bfa",
    coords: [[30.0696328,31.3488839],[30.0609789,31.3499782],[30.0617775,31.3578103],[30.0645167,31.3577459],[30.0679244,31.3568232],[30.06954,31.3557074],[30.071007,31.35442],[30.0699113,31.3519953]]
  }
];

// ── Ride app fallback (InDrive: try deep link, fall back to web) ──
function fallbackRide(e, webUrl) {
  // Let the deep link attempt; if app not installed, open web after short delay
  setTimeout(() => {
    if (!document.hidden) window.open(webUrl, '_blank');
  }, 1500);
}

// ── Map init ──
const map = L.map('map', {
  center: [30.052, 31.360],
  zoom: 14,
  zoomControl: true
});

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap · © CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── State ──
let activeFilter = 'all';
let sheetOpen = false;
const markers = [];
const zonePolygons = [];

// ── Build custom marker icon ──
function makeIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">
    <path d="M14 0C6.268 0 0 6.268 0 14c0 9.333 14 24 14 24S28 23.333 28 14C28 6.268 21.732 0 14 0z" fill="${color}" opacity="0.9"/>
    <circle cx="14" cy="14" r="6" fill="white" opacity="0.95"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [28, 38],
    iconAnchor: [14, 38],
    popupAnchor: [0, -40]
  });
}

// ── Popup builder ──
function buildPopup(loc) {
  const gmapsQuery = loc.google
    ? `https://maps.google.com/?q=${encodeURIComponent(loc.google)}`
    : `https://maps.google.com/?q=${loc.coords[0]},${loc.coords[1]}`;

  const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.coords[0]},${loc.coords[1]}`;

  // InDrive: deep link with destination lat/lng
  const indriveUrl = `indrive://route?end_lat=${loc.coords[0]}&end_lon=${loc.coords[1]}&end_address=${encodeURIComponent(loc.name)}`;
  const indriveWeb  = `https://indrive.com/app/ride?end_lat=${loc.coords[0]}&end_lon=${loc.coords[1]}`;

  // Uber: mobile universal link
  const uberUrl = `https://m.uber.com/ul/?action=setPickup&dropoff[latitude]=${loc.coords[0]}&dropoff[longitude]=${loc.coords[1]}&dropoff[nickname]=${encodeURIComponent(loc.name)}`;

  return `
    <div class="popup-inner">
      <div class="popup-cat" style="color:${loc.color}">${loc.category}</div>
      <div class="popup-name">${loc.name}</div>
      <div class="popup-addr">${loc.address}</div>
      <div class="popup-actions">
        <a class="btn btn-primary" href="${directionsUrl}" target="_blank">🧭 Directions</a>
        <a class="btn btn-ghost" href="${gmapsQuery}" target="_blank">📍 Maps</a>
      </div>
      <div class="popup-ride-label">Book a ride</div>
      <div class="popup-actions">
        <a class="btn btn-ride btn-indrive" href="${indriveUrl}" target="_blank"
           onclick="fallbackRide(event, '${indriveWeb}')">
          <img src="https://indrive.com/favicon.ico" width="14" height="14" style="border-radius:3px" onerror="this.style.display='none'">
          InDrive
        </a>
        <a class="btn btn-ride btn-uber" href="${uberUrl}" target="_blank">
          <img src="https://www.uber.com/favicon.ico" width="14" height="14" style="border-radius:3px" onerror="this.style.display='none'">
          Uber
        </a>
      </div>
    </div>`;
}

// ── Add markers ──
LOCATIONS.forEach((loc, i) => {
  const marker = L.marker(loc.coords, { icon: makeIcon(loc.color) })
    .bindPopup(buildPopup(loc), { maxWidth: 280 });

  marker.locData = loc;
  markers.push(marker);
  marker.addTo(map);
});

// ── Add zone polygons ──
ZONES.forEach(zone => {
  const poly = L.polygon(zone.coords, {
    color: zone.color,
    weight: 2,
    opacity: 0.85,
    fillColor: zone.color,
    fillOpacity: 0.15
  }).bindPopup(`<div class="popup-inner"><div class="popup-name">${zone.name}</div></div>`);

  poly.zoneData = zone;
  zonePolygons.push(poly);
  poly.addTo(map);
});

// ── Filter logic ──
function applyFilter(filter) {
  activeFilter = filter;

  markers.forEach(m => {
    const match = filter === 'all' || m.locData.category === filter;
    if (match) {
      if (!map.hasLayer(m)) m.addTo(map);
    } else {
      if (map.hasLayer(m)) map.removeLayer(m);
    }
  });

  const showZones = filter === 'all' || filter === 'zones';
  zonePolygons.forEach(p => {
    if (showZones) { if (!map.hasLayer(p)) p.addTo(map); }
    else { if (map.hasLayer(p)) map.removeLayer(p); }
  });

  renderSheet();
}

// ── Chips ──
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    applyFilter(chip.dataset.filter);
  });
});

// ── Sheet render ──
function renderSheet() {
  const body = document.getElementById('sheetBody');
  const visible = activeFilter === 'zones'
    ? []
    : LOCATIONS.filter(l => activeFilter === 'all' || l.category === activeFilter);

  document.getElementById('countLabel').textContent = `${visible.length} place${visible.length !== 1 ? 's' : ''}`;

  if (visible.length === 0) {
    body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">
      No locations for this filter
    </div>`;
    return;
  }

  body.innerHTML = visible.map((loc, i) => `
    <div class="place-row" data-idx="${LOCATIONS.indexOf(loc)}">
      <div class="place-icon" style="background:${loc.color}22">
        ${loc.icon}
      </div>
      <div class="place-info">
        <div class="place-name">${loc.name}</div>
        <div class="place-sub">${loc.category} · ${loc.address.split(',')[0]}</div>
      </div>
      <div class="place-arrow">›</div>
    </div>
  `).join('');

  body.querySelectorAll('.place-row').forEach(row => {
    row.addEventListener('click', () => {
      const loc = LOCATIONS[+row.dataset.idx];
      const marker = markers[+row.dataset.idx];
      closeSheet();
      setTimeout(() => {
        map.flyTo(loc.coords, 16, { duration: 0.8 });
        setTimeout(() => marker.openPopup(), 900);
      }, 300);
    });
  });
}

// ── Sheet toggle ──
const sheet = document.getElementById('sheet');
const fabBtn = document.getElementById('fabBtn');

function openSheet() {
  sheetOpen = true;
  sheet.classList.add('open');
  fabBtn.textContent = '✕';
}

function closeSheet() {
  sheetOpen = false;
  sheet.classList.remove('open');
  fabBtn.textContent = '☰';
}

fabBtn.addEventListener('click', () => sheetOpen ? closeSheet() : openSheet());
document.getElementById('sheetHandle').addEventListener('click', () => sheetOpen ? closeSheet() : openSheet());

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── User location ──
map.on('locationfound', e => {
  L.circleMarker(e.latlng, {
    radius: 8,
    color: '#4ade80',
    fillColor: '#4ade80',
    fillOpacity: 0.5,
    weight: 2
  }).addTo(map).bindPopup('You are here');
  showToast('📍 Your location found');
});

map.on('locationerror', () => showToast('Location not available'));

// Add locate button
const LocateControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const btn = L.DomUtil.create('button', 'leaflet-bar leaflet-control');
    btn.innerHTML = '📍';
    btn.title = 'My location';
    btn.style.cssText = `
      background: var(--surface, #1a1d27);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8eaf6;
      width: 36px; height: 36px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    `;
    L.DomEvent.on(btn, 'click', () => map.locate({ setView: false, maxZoom: 16 }));
    L.DomEvent.disableClickPropagation(btn);
    return btn;
  }
});
new LocateControl().addTo(map);

// ── Init ──
renderSheet();
</script>
</body>
</html>
